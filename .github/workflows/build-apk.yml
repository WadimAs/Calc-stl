name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the standard Android Gradle files that are not committed.
      # Existing files (lib/, AndroidManifest.xml, MainActivity.kt, icons) are kept.
      - name: Generate platform files
        run: |
          flutter create --platforms=android --org com.printcalc --project-name stl_weight .
          rm -f test/widget_test.dart

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk stl-weight.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stl-weight-apk
          path: stl-weight.apk

      # Every build on main becomes a release, so the APK can be downloaded
      # straight from the Releases page on a phone.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Збірка {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: stl-weight.apk
