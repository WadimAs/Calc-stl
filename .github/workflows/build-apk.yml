name: Build APK

# Every push is built and tested; a release (what the app offers as an
# update) is published only when started by hand with "release" checked.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Опублікувати як реліз (оновлення в застосунку)'
        type: boolean
        default: true

permissions:
  contents: write

# A newer push cancels an older check build (releases are never cancelled).
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ hashFiles('pubspec.yaml', '.github/scripts/add_deps.py') }}
          restore-keys: gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the standard Android Gradle files that are not committed.
      # Existing files (lib/, AndroidManifest.xml, MainActivity.kt, icons) are kept.
      - name: Generate platform files
        run: |
          flutter create --platforms=android --org com.printcalc --project-name stl_weight .
          rm -f test/widget_test.dart
          python3 .github/scripts/add_deps.py

      - run: flutter pub get

      - name: Analyze
        # Errors are repeated as annotations so they are visible in the run summary.
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          # One annotation with all errors (GitHub shows at most 10 annotations per step).
          errs=$(grep -E "^\s*error " analyze.txt | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$errs" ] && echo "::error::$errs"
          exit $code

      - name: Unit tests
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            grep -E "Error|Expected|Actual|error:|\[E\]|Exception|\.dart:[0-9]+" test.txt | head -40 | while read -r line; do echo "::error::$line"; done
          fi
          exit $code

      # A fixed signing key lets new APKs install over old ones.
      # Stored once as the repository secret SIGNING_KEYSTORE_B64.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/stl.keystore"
            export STL_KEYSTORE="$RUNNER_TEMP/stl.keystore"
            echo "STL_KEYSTORE=$STL_KEYSTORE" >> "$GITHUB_ENV"
            python3 .github/scripts/use_release_key.py
          else
            echo "::warning::Secret SIGNING_KEYSTORE_B64 is not set: this APK uses a temporary key and will not update an installed copy."
          fi

      # One APK per CPU type keeps the download small: 64-bit ARM (almost all
      # phones) is the main one, 32-bit ARM for old phones.
      - name: Build release APKs
        run: |
          V="--build-number=${{ github.run_number }} --build-name=1.3.${{ github.run_number }}"
          # Check builds (every push) only need one; releases get both.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            flutter build apk --release --target-platform android-arm $V
            cp build/app/outputs/flutter-apk/app-release.apk stl-weight-arm32.apk
          fi
          flutter build apk --release --target-platform android-arm64 $V
          cp build/app/outputs/flutter-apk/app-release.apk stl-weight.apk
          ls -la *.apk

      - name: Verify signature
        if: env.STL_KEYSTORE != ''
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in stl-weight*.apk; do
            "$APKSIGNER" verify --print-certs "$f" | tee certs.txt
            grep -q "CN=STL Vaga" certs.txt || { echo "::error::$f is not signed with the persistent key"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: stl-weight-apk
          path: |
            stl-weight.apk
            stl-weight-arm32.apk

      # Every build on main becomes a release, so the APK can be downloaded
      # straight from the Releases page on a phone.
      - name: Release notes
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: python3 .github/scripts/release_notes.py > release_notes.md && cat release_notes.md

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Версія 1.3.${{ github.run_number }}
          body_path: release_notes.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            stl-weight.apk
            stl-weight-arm32.apk
