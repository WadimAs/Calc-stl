name: Stats server (Cloudflare)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check secrets
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!s}" ] || { echo "::error::Secret $s is missing"; exit 1; }
          done
          [ -n "${{ secrets.STATS_ADMIN_KEY }}" ] || { echo "::error::Secret STATS_ADMIN_KEY is missing"; exit 1; }
      - name: Database
        working-directory: tool/stats-worker
        run: |
          W="npx -y wrangler@3"
          id() { $W d1 list --json | python3 -c "import json,sys;print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='stl-vaga-stats'),''))"; }
          ID=$(id)
          if [ -z "$ID" ]; then $W d1 create stl-vaga-stats; ID=$(id); fi
          echo "database $ID"
          sed -i "s/__DB_ID__/$ID/" wrangler.toml
          $W d1 execute stl-vaga-stats --remote --file schema.sql
      - name: Deploy
        working-directory: tool/stats-worker
        run: |
          W="npx -y wrangler@3"
          $W deploy 2>&1 | tee deploy.log
          printf '%s' "${{ secrets.STATS_ADMIN_KEY }}" | $W secret put ADMIN_KEY
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::No workers.dev URL — open Workers & Pages in the Cloudflare dashboard once to get a workers.dev subdomain"; exit 1; }
          echo "::notice::Stats server: $URL"
          curl -s "$URL/"
          echo
          cd ../..
          if [ "$(cat assets/stats_url.txt 2>/dev/null)" != "$URL" ]; then
            printf '%s' "$URL" > assets/stats_url.txt
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add assets/stats_url.txt
            git commit -m "Адреса сервера статистики"
            git push
          fi
