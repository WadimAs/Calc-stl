name: Promo video

on:
  workflow_dispatch:
    inputs:
      cut:
        description: "long (~1:45) or short (~45 s, faster, energetic music)"
        type: choice
        options: [long, short]
        default: long
      voice:
        description: "Edge TTS voice (if no ElevenLabs key)"
        default: "uk-UA-OstapNeural"
      eleven_voice:
        description: "ElevenLabs voice_id (default: Alex Nekrasov)"
        default: "9Sj8ugvpK1DmcAXyvi3a"
      eleven_model:
        description: "ElevenLabs model"
        default: "eleven_multilingual_v2"
      new_music:
        description: "Generate new background music (otherwise reuse the last one)"
        type: boolean
        default: false
      music_prompt:
        description: "Music prompt (empty = default upbeat tech promo)"
        default: ""

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-dejavu-core >/dev/null || sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q edge-tts pillow
      - name: Screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ui-results -p ui-results.zip -R ${{ github.repository }}
          mkdir shots && cd shots && unzip -q ../ui-results.zip
          ls | head -80
          cd ..
          if gh release download promo-clips -p promo-clips.zip -R ${{ github.repository }}; then
            mkdir clips && cd clips && unzip -q ../promo-clips.zip && ls -la && cat marks.txt
          fi
      - name: Music
        env:
          GH_TOKEN: ${{ github.token }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PROMO_MUSIC_PROMPT: ${{ inputs.music_prompt }}
          PROMO_CUT: ${{ inputs.cut }}
        run: |
          m=music.mp3; len=150
          [ "$PROMO_CUT" = "short" ] && m=music-short.mp3 && len=60
          if [ "${{ inputs.new_music }}" != "true" ] && gh release download promo-video -p $m -R ${{ github.repository }}; then
            echo "reusing $m"
          elif [ -n "$ELEVENLABS_API_KEY" ]; then
            python3 tool/promo/music.py $m $len || rm -f $m
          fi
          ls -la $m || true
      - name: Render
        env:
          PROMO_VOICE: ${{ inputs.voice }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE: ${{ inputs.eleven_voice }}
          ELEVEN_MODEL: ${{ inputs.eleven_model }}
          PROMO_CUT: ${{ inputs.cut }}
        run: |
          d=shots; [ -f shots/04_model.png ] || d=$(dirname "$(find shots -name 04_model.png | head -1)")
          [ -d clips ] && export PROMO_CLIPS=$PWD/clips
          m=music.mp3; out=promo.mp4
          [ "$PROMO_CUT" = "short" ] && m=music-short.mp3 && out=promo-short.mp4
          [ -s $m ] && export PROMO_MUSIC=$PWD/$m
          if [ -n "$ELEVENLABS_API_KEY" ]; then echo "voice: ElevenLabs ${ELEVEN_MODEL} ${ELEVEN_VOICE:-George}" > render.log; else echo "voice: Edge $PROMO_VOICE (no ElevenLabs key)" > render.log; fi
          python3 tool/promo/make_video.py "$d" $out 2>&1 | tee -a render.log
          test -s $out
          ls -la $out
          [ "$PROMO_CUT" = "short" ] && mv render.log render-short.log || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: promo-video
          name: Промо-відео
          prerelease: true
          make_latest: false
          files: |
            promo*.mp4
            render*.log
            music*.mp3
          body: Промо-відео застосунку (згенеровано автоматично).
