name: Cleanup old test releases

# Removes the old per-run UI test pre-releases (ui-1, ui-2, …) and their tags.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete ui-N pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^ui-[0-9]+$' \
            | while read -r t; do
                echo "deleting $t"
                gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
