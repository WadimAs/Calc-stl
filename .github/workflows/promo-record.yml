name: Promo recording (emulator)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Gradle downloads and build cache: the Android build is the slowest part.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ui-${{ hashFiles('pubspec.yaml', '.github/scripts/add_deps.py') }}
          restore-keys: gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: |
          flutter create --platforms=android --org com.printcalc --project-name stl_weight .
          rm -f test/widget_test.dart
          python3 .github/scripts/add_deps.py
          flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A booted emulator snapshot is cached, so later runs start in seconds.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-pixel6-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot created"

      # Build the test APK while nothing else runs; the run below reuses it.
      - name: Build debug APK
        run: |
          mkdir -p promo-clips
          timeout 900 flutter build apk --debug -v > promo-clips/build.log 2>&1; code=$?
          tail -60 promo-clips/build.log
          exit $code

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/promo_run.sh

      - name: Pack clips
        if: always()
        run: |
          grep -E "PROMO_FAILED|EXCEPTION|flutter test exit" promo-clips/drive.txt | head -30 | while read -r l; do echo "::warning::$l"; done || true
          mkdir -p promo-clips && cd promo-clips && zip -q -r ../promo-clips.zip . && cd .. && ls -la promo-clips.zip

      - name: Publish clips
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: promo-clips
          name: Промо — записи екрана
          body: Записи екрана емулятора для промо-відео.
          prerelease: true
          make_latest: false
          files: promo-clips.zip
