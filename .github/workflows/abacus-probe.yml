name: Abacus probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee out.txt) 2>&1
          B=https://abacus.jasoncameron.dev
          NS=kotushka-probe-$RANDOM
          echo "NS=$NS"
          curl -sS -i "$B/create/$NS/big1?initializer=281474976710655" | sed -n '1p;$p'; echo
          curl -sS "$B/get/$NS/big1"; echo
          curl -sS -i "$B/create/$NS/big2?initializer=72057594037927935" | sed -n '1p;$p'; echo
          curl -sS "$B/get/$NS/big2"; echo
          R=$(curl -sS "$B/create/$NS/st1?initializer=5")
          echo "$R"
          K=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin).get('admin_key',''))")
          curl -sS -i -X POST -H "Authorization: Bearer $K" "$B/set/$NS/st1?value=1234567" | sed -n '1p;$p'; echo
          curl -sS "$B/get/$NS/st1"; echo
          curl -sS -i "$B/create/$NS/st1?initializer=9" | sed -n '1p;$p'; echo
          curl -sS "$B/hit/$NS/seq"; echo
          curl -sS "$B/hit/$NS/seq"; echo
          sleep 1
          gh release view probe -R ${{ github.repository }} >/dev/null 2>&1 || gh release create probe -R ${{ github.repository }} --prerelease --title probe --notes probe
          gh release upload probe out.txt --clobber -R ${{ github.repository }}
