name: UI test (emulator)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integration_test/**'
      - 'test_driver/**'
      - '.github/workflows/ui-test.yml'
      - '.github/scripts/ui_run.sh'
      - 'android/**'
      - '.github/scripts/add_deps.py'

permissions:
  contents: write

# A newer push makes the older test run pointless.
concurrency:
  group: ui-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Gradle downloads and build cache: the Android build is the slowest part.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ui-${{ hashFiles('pubspec.yaml', '.github/scripts/add_deps.py') }}
          restore-keys: gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: |
          flutter create --platforms=android --org com.printcalc --project-name stl_weight .
          rm -f test/widget_test.dart
          python3 .github/scripts/add_deps.py
          flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A booted emulator snapshot is cached, so later runs start in seconds.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-pixel6-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot created"

      # Build the test APK while nothing else runs; the run below reuses it.
      - name: Build debug APK
        run: flutter build apk --debug

      # The minified release build is checked only when Android parts change.
      - name: Check if Android parts changed
        id: android
        run: |
          git fetch --depth=2 origin ${{ github.sha }} >/dev/null 2>&1 || true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(android/|pubspec.yaml|\.github/scripts/add_deps.py)'; then
            echo "r8=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK (x86_64, for the R8 check)
        if: steps.android.outputs.r8 == 'true'
        run: |
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk release-x64.apk

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/ui_run.sh

      - name: Pack results
        if: always()
        run: |
          mkdir -p screenshots
          cp drive.txt logcat.txt screenshots/ 2>/dev/null || true
          grep -E "OCR_SELFTEST|UI_STEP_FAILED|UI_ERRORS|EXCEPTION CAUGHT|flutter test exit|All tests passed|Some tests failed" drive.txt | head -60 | while read -r l; do echo "::warning::$l"; done || true
          cd screenshots && zip -q -r ../ui-results.zip . && cd ..
          ls -la screenshots | head -80

      - name: Publish results
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          # One pre-release that is overwritten each run (not offered as an update).
          tag_name: ui-results
          name: UI test (останній запуск)
          body: Знімки екрана й журнал автотесту на емуляторі, запуск ${{ github.run_number }}.
          prerelease: true
          make_latest: false
          files: ui-results.zip
