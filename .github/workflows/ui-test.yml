name: UI test (emulator)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integration_test/**'
      - 'test_driver/**'
      - '.github/workflows/ui-test.yml'
      - '.github/scripts/ui_run.sh'

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: |
          flutter create --platforms=android --org com.printcalc --project-name stl_weight .
          rm -f test/widget_test.dart
          python3 .github/scripts/add_deps.py
          flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build before the emulator starts, so the emulator time is spent on the test.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/ui_run.sh

      - name: Pack results
        if: always()
        run: |
          mkdir -p screenshots
          cp drive.txt logcat.txt screenshots/ 2>/dev/null || true
          grep -E "UI_STEP_FAILED|UI_ERRORS|EXCEPTION CAUGHT|flutter test exit|All tests passed|Some tests failed" drive.txt | head -60 | while read -r l; do echo "::warning::$l"; done || true
          cd screenshots && zip -q -r ../ui-results.zip . && cd ..
          ls -la screenshots | head -80

      - name: Publish results
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-${{ github.run_number }}
          name: UI test ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: ui-results.zip
